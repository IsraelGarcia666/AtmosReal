<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AtmosReal - Planetary Weather Intelligence</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="bg-slate-950 text-white">
    <!-- Full-screen lunar observation scene -->
    <main id="observation-scene">
      <!-- Interactive 3D Earth -->
      <div id="globe"></div>

      <!-- Decorative lunar foreground -->
      <div id="lunar-surface" aria-hidden="true"></div>

      <!-- Application header -->
      <header id="app-header" class="text-center">
        <h1 class="text-4xl md:text-5xl font-bold tracking-widest">
          Atmos<span class="text-cyan-400">Real</span>
        </h1>

        <p class="mt-2 text-slate-300">Planetary Weather Intelligence</p>
      </header>

      <!-- Observation station controls -->
      <div id="observation-controls">
        <nav class="flex flex-wrap justify-center gap-3">
          <button id="rotate-btn" type="button" class="control-btn">
            Pause rotation
          </button>

          <button id="zoom-in-btn" type="button" class="control-btn">
            + Zoom
          </button>

          <button id="zoom-out-btn" type="button" class="control-btn">
            − Zoom
          </button>

          <button id="reset-btn" type="button" class="control-btn reset-btn">
            Reset
          </button>
          <!-- Switch between planetary observation modes -->
          <button
            id="mode-btn"
            type="button"
            class="control-btn mode-btn"
            aria-pressed="false"
            disabled
          >
            Exploration mode
          </button>
        </nav>

        <p id="coordinates" class="text-center mt-4 text-emerald-400">
          Select a location to explore Earth
        </p>

        <!-- Navigate to the weather dashboard -->
        <div class="text-center mt-2">
          <button
            id="view-weather-btn"
            type="button"
            class="control-btn hidden border-emerald-400 text-emerald-400"
          >
            View Weather ↓
          </button>
        </div>
      </div>
    </main>
    <!-- Weather information dashboard -->
    <section
      id="weather-panel"
      class="hidden min-h-[100svh] bg-slate-950 text-white p-6"
    >
      <div class="max-w-4xl mx-auto">
        <h2 class="text-2xl font-bold text-cyan-400">Weather Intelligence</h2>

        <p id="weather-location" class="mt-2 text-slate-400">
          Selected location
        </p>

        <!-- Current temperature -->
        <p id="weather-temperature" class="text-5xl font-bold mt-6">-- °C</p>

        <!-- Weather information cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
          <div class="bg-slate-900 rounded-xl p-4">
            <p class="text-sky-400">Humidity</p>
            <p id="weather-humidity">--</p>
          </div>

          <div class="bg-slate-900 rounded-xl p-4">
            <p class="text-amber-400">Elevation</p>
            <p id="weather-elevation">--</p>
          </div>

          <div class="bg-slate-900 rounded-xl p-4">
            <p class="text-violet-400">Local data time</p>
            <p id="weather-time">--</p>
          </div>

          <div class="bg-slate-900 rounded-xl p-4">
            <p class="text-emerald-400">Time zone</p>
            <p id="weather-timezone">--</p>
          </div>
        </div>

        <p
          id="weather-status"
          class="mt-6 text-sm text-slate-400"
          aria-live="polite"
        >
          Data provider: Open-Meteo
        </p>

        <a href="#observation-scene" class="inline-block mt-4 text-cyan-400">
          ↑ Return to Earth
        </a>
      </div>
    </section>
    <script type="module" src="./globe.js"></script>
  </body>
</html>
