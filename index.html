<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AtmosReal - Planetary Weather Intelligence</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="bg-slate-950 text-white">
    <!-- Full-screen lunar observation scene -->
    <main id="observation-scene">
      <!-- Interactive 3D Earth -->
      <div id="globe"></div>

      <!-- Decorative lunar foreground -->
      <div id="lunar-surface" aria-hidden="true"></div>

      <!-- Application header -->
      <header id="app-header" class="text-center">
        <h1 class="text-4xl md:text-5xl font-bold tracking-widest">
          Atmos<span class="text-cyan-400">Real</span>
        </h1>

        <p class="mt-2 text-slate-300">Planetary Weather Intelligence</p>
      </header>

      <!-- Observation station controls -->
      <div id="observation-controls">
        <nav class="flex flex-wrap justify-center gap-3">
          <button id="rotate-btn" type="button" class="control-btn">
            Pause rotation
          </button>

          <button id="zoom-in-btn" type="button" class="control-btn">
            + Zoom
          </button>

          <button id="zoom-out-btn" type="button" class="control-btn">
            − Zoom
          </button>

          <button id="reset-btn" type="button" class="control-btn reset-btn">
            Reset
          </button>
          <!-- Switch between planetary observation modes -->
          <button
            id="mode-btn"
            type="button"
            class="control-btn mode-btn"
            aria-pressed="false"
            disabled
          >
            Exploration mode
          </button>
        </nav>

        <p id="coordinates" class="text-center mt-4 text-emerald-400">
          Select a location to explore Earth
        </p>
      </div>
    </main>

    <script type="module" src="./globe.js"></script>
  </body>
</html>
